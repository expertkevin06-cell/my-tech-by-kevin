<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Icônes & images — Ma Tech by Kevin</title></head>
<body style="font-family:system-ui;background:#111;color:#fff;padding:2rem;text-align:center">
<h2>Ma Tech by Kevin — générateur d'icônes & images</h2>
<p>Un seul clic : télécharge les 6 fichiers, puis rangez-les :<br>
<code>assets/icons/</code> → icon-192.png, icon-512.png, icon-maskable-512.png, favicon-32.png, apple-touch-180.png<br>
<code>assets/screenshots/</code> → screenshot-1280x720.png</p>
<button onclick="tout()" style="font-size:1.2rem;padding:1rem 2rem;cursor:pointer">⬇️ Tout télécharger (6 fichiers)</button>
<div><canvas id="c" style="margin-top:1rem;border:1px solid #444"></canvas></div>
<script>
function logo(ctx, S, mask){
  ctx.fillStyle = "#0b0f1a"; ctx.fillRect(0,0,S,S);
  const k = mask ? 0.62 : 1;
  ctx.save(); ctx.translate(S/2,S/2); ctx.scale(k,k); ctx.translate(-S/2,-S/2);
  ctx.strokeStyle = "#2e8fff"; ctx.lineWidth = S*0.058;
  ctx.beginPath(); ctx.arc(S/2,S*0.46,S*0.29,0,7); ctx.stroke();
  ctx.strokeStyle = "#f39c12"; ctx.lineWidth = S*0.05; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(S*0.27,S*0.46); ctx.lineTo(S*0.38,S*0.46); ctx.lineTo(S*0.44,S*0.34);
  ctx.lineTo(S*0.51,S*0.58); ctx.lineTo(S*0.57,S*0.46); ctx.lineTo(S*0.68,S*0.46);
  ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold "+(S*0.14)+"px Arial"; ctx.textAlign = "center";
  ctx.fillText("MTK", S/2, S*0.88);
  ctx.restore();
}
function screenshot(ctx, W, H){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#131a2a"); g.addColorStop(1,"#0b0f1a");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#2e8fff"; ctx.font = "bold 84px Arial"; ctx.textAlign = "center";
  ctx.fillText("⚙️ Ma Tech by Kevin", W/2, H*0.42);
  ctx.fillStyle = "#e8ecf4"; ctx.font = "40px Arial";
  ctx.fillText("21 000 fiches DTC • Rappels 2017-2026", W/2, H*0.55);
  ctx.fillStyle = "#f39c12"; ctx.font = "34px Arial";
  ctx.fillText("En ligne & hors ligne — sauvegarde locale", W/2, H*0.65);
}
function fichier(w, h, fn, nom){
  const c = document.getElementById("c"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  fn(ctx, w, h);
  const a = document.createElement("a");
  a.download = nom; a.href = c.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
}
function tout(){
  fichier(192,192,(x,w)=>logo(x,w,false),"icon-192.png");
  setTimeout(()=>fichier(512,512,(x,w)=>logo(x,w,false),"icon-512.png"),350);
  setTimeout(()=>fichier(512,512,(x,w)=>logo(x,w,true),"icon-maskable-512.png"),700);
  setTimeout(()=>fichier(32,32,(x,w)=>logo(x,w,false),"favicon-32.png"),1050);
  setTimeout(()=>fichier(180,180,(x,w)=>logo(x,w,false),"apple-touch-180.png"),1400);
  setTimeout(()=>fichier(1280,720,(x,w,h)=>screenshot(x,w,h),"screenshot-1280x720.png"),1750);
}
tout();
</script></body></html>
