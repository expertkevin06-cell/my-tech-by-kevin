<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/><stop offset=".35" stop-color="#e0501a"/>
      <stop offset=".7" stop-color="#8f2a08"/><stop offset="1" stop-color="#4a1403"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="0">
