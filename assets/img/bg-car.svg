      <stop offset="0" stop-color="#3a4656"/><stop offset=".55" stop-color="#141a22"/><stop offset="1" stop-color="#05070a"/>
    </radialGradient>
  </defs>
  <ellipse cx="820" cy="760" rx="660" ry="60" fill="#000" opacity=".6"/>
  <ellipse cx="760" cy="520" rx="760" ry="300" fill="url(#glow)"/>
