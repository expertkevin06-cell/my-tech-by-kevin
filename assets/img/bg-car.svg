  <g>
    <ellipse cx="430" cy="640" rx="96" ry="92" fill="url(#wheel)"/>
    <ellipse cx="430" cy="640" rx="52" ry="50" fill="#232c38"/>
    <g stroke="#9fb0c4" stroke-width="9" stroke-linecap="round">
      <path d="M430 596 V684 M386 640 H474 M398 608 L462 672 M462 608 L398 672"/>
    </g>
    <ellipse cx="1080" cy="640" rx="86" ry="82" fill="url(#wheel)"/>
