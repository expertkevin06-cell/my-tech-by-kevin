  <path d="M196 560 C240 540 300 528 360 524 L368 560 C300 566 240 574 200 584 Z" fill="#1a0b04" opacity=".85"/>
  <path d="M212 500 C260 486 320 476 380 472 L386 496 C320 502 260 510 216 520 Z" fill="#ffd9b0" opacity=".85"/>
